name: customer_app
description: Ditto customer app — browse tailors and rental shops, place orders, track rentals.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ditto brand palette (lib/core/theme.dart): cream background, brown "D"
# monogram, gold accent dot. ios: false — neither app has generated its
# ios/ platform folder yet (needs a real Apple Developer team id, see
# docs/APP_STORE_LISTING.md); flip to true once ios/ exists and re-run
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FBF7F1"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FBF7F1"
    theme_color: "#8A6244"
