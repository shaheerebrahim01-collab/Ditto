name: tailor_app
description: Ditto tailor app — dashboard, incoming orders, and portfolio management for tailors.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^8.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ditto brand palette (lib/core/theme.dart), inverted from customer_app's
# icon so the two are visually distinguishable at a glance on a home
# screen that has both installed: brown background, cream "D" monogram,
# gold accent dot. ios: false — see the same note in customer_app's
# pubspec.yaml; neither app has generated its ios/ platform folder yet.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8A6244"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#8A6244"
    theme_color: "#8A6244"
